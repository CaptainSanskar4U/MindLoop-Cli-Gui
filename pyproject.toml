[project]
name = "mindloop"
version = "0.5.0"
description = "MINDLOOP - Local-first adaptive learning engine (simple RAG + test loop)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9",
  "rich>=13",
  "pymupdf>=1.23",
  "scikit-learn>=1.3",
  "pydantic>=2",
  "httpx>=0.25",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "reportlab>=4",
]
gui = [
  "streamlit>=1.30",
]

[project.scripts]
mindloop = "mindloop.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mindloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs real Ollama running",
]
